<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Просмотр 3D модели</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
  <style>
    .detail-page { padding: 28px 0 44px; }
    .viewer-controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 16px; }
    .viewer-controls button { border: 1px solid var(--border); background: #fff; color: var(--accent-dark); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
    #viewer-canvas { width: 100%; height: 70vh; display: block; border-radius: 16px; background: #e6ebf5; border: 1px solid var(--border); }
    #model-title { text-align: center; margin-top: 16px; font-size: 1.2rem; color: var(--accent-dark); font-weight: 700; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container header-top">
      <a class="logo" href="gallery.html">ГОСУДАРСТВЕННЫЙ СУДОСТРОИТЕЛЬНЫЙ КОМПЛЕКС</a>
      <nav class="site-nav">
        <a href="gallery.html">← В ГАЛЕРЕЮ</a>
      </nav>
    </div>
  </header>

  <main class="detail-page">
    <div class="container">
      <div class="viewer-controls">
        <button id="zoom-in">+</button>
        <button id="zoom-out">−</button>
        <button id="view-front">Вид спереди</button>
        <button id="view-back">Сзади</button>
        <button id="view-left">Слева</button>
        <button id="view-right">Справа</button>
      </div>
      <canvas id="viewer-canvas"></canvas>
      <div id="model-title"></div>
    </div>
  </main>

  <script type="module" src="model-detail.js"></script>
</body>
</html>
