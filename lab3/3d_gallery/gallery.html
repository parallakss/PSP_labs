<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Галерея кораблей</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
  <style>
    .gallery-page { padding: 32px 0 56px; }
    .gallery-top { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 24px; }
    .gallery-upload { display: inline-flex; align-items: center; gap: 10px; }
    .gallery-upload input { max-width: 280px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
    .gallery-card { background: #fff; border: 1px solid var(--border); border-radius: 18px; padding: 12px; cursor: pointer; box-shadow: 0 12px 30px rgba(5, 35, 61, 0.08); transition: transform .2s ease; }
    .gallery-card:hover { transform: translateY(-3px); }
    .preview-canvas { width: 100%; height: 170px; border-radius: 12px; display: block; }
    .gallery-card-title { margin: 12px 4px 4px; font-size: 1rem; color: var(--accent-dark); }
    @media (max-width: 1100px) { .gallery-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 700px) {
      .gallery-top { flex-direction: column; align-items: flex-start; }
      .gallery-grid { grid-template-columns: 1fr; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container header-top">
      <a class="logo" href="gallery.html">ГОСУДАРСТВЕННЫЙ СУДОСТРОИТЕЛЬНЫЙ КОМПЛЕКС</a>
      <nav class="site-nav">
        <a href="gallery.html">ГЛАВНАЯ</a>
        <a href="gallery.html">УСЛУГИ</a>
        <a href="gallery.html">ЗАЯВКИ</a>
      </nav>
    </div>
  </header>

  <main class="gallery-page">
    <div class="container">
      <div class="gallery-top">
        <div>
          <h1 class="section-title">3D-галерея кораблей (GLB)</h1>
          <p class="text-default">Предпросмотр моделей, загрузка своих GLB в IndexedDB и детальный просмотр.</p>
        </div>
        <label class="gallery-upload">
          <span>Загрузить модель:</span>
          <input type="file" id="uploadModel" accept=".glb,.gltf" multiple>
        </label>
      </div>
      <section id="card-list" class="gallery-grid"></section>
    </div>
  </main>

  <script type="module" src="gallery.js"></script>
</body>
</html>
